<!-- atoms/b-option — one <option>, bound from data. PARENT CONTEXT: only meaningful inside
     b-choice's <select>, where a nested each renders one per entry of the item's `options`.
     Per-item DATA: value, label, selected ("selected", not ""). No .css: an option is styled
     by the platform. -->
<option data-bind-value="value" data-bind-selected="selected" data-field="label">Option</option>
