name: Publish packages

# Publishes @tjakoen/{grain,mill,proof,crumb} to the PUBLIC npm registry when their version
# changes. Bump a package's version in its package.json and push to main: this publishes the new
# version and skips any version already on the registry (so ordinary commits are a no-op).
#
# Auth is npm TRUSTED PUBLISHING (OIDC) — there is NO token anywhere in this workflow. npm trusts
# this specific repo + workflow filename, and that trust is configured PER PACKAGE, so all four
# need it set at npmjs.com/package/@tjakoen/<name>/access. Renaming this file breaks all four at
# once until each publisher config is updated to match.
#
# Three things this job must NOT do, each of which silently disables the OIDC exchange:
#
#  1. Set `registry-url` on setup-node. It writes an .npmrc line
#     `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`; with no token set that expands to
#     EMPTY, npm reads it as "auth is already configured" and never performs the token exchange.
#     (Same shape as the committed `_authToken=${GITHUB_TOKEN}` that used to 401 every cold
#     install — an empty auth value overriding a working default.) See actions/setup-node#1551.
#  2. Set NODE_AUTH_TOKEN at all, empty or otherwise.
#  3. Run on npm older than 11.5.1, which predates OIDC support. Node 24 ships a new enough npm,
#     but the explicit upgrade keeps this true regardless of what the runner image changes to.
#
# --provenance is passed explicitly: the docs say public-repo provenance is automatic, but it has
# been reported not to fire without the flag, and passing it makes the failure loud rather than
# a silently unsigned package.
#
# --@tjakoen:registry is belt-and-braces. Nothing writes an .npmrc here now, but a scope mapping
# beats both publishConfig and --registry, so pinning it keeps a future added step from
# retargeting this job (and `npm view` from reporting another registry's versions).
#
# The loop order is the dependency order — grain, then mill, then proof and crumb.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs Node >= 22.14
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: Publish new package versions
        run: |
          set -euo pipefail
          reg=--@tjakoen:registry=https://registry.npmjs.org
          for p in grain mill proof crumb; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$reg" "@tjakoen/$p@$v" version >/dev/null 2>&1; then
              echo "@tjakoen/$p@$v already published — skipping"
            else
              # Substitute workspace:* deps -> the concrete sibling versions BEFORE publishing.
              # `npm publish -w` in this runner does not reliably rewrite the workspace: protocol
              # (crumb@0.1.0 shipped with literal "workspace:*" and was uninstallable), so do it
              # explicitly — the checkout is ephemeral, so mutating the manifest here is safe.
              node -e '
                const fs = require("fs");
                const ver = (n) => require(`./packages/${n}/package.json`).version;
                const map = { "@tjakoen/grain": ver("grain"), "@tjakoen/mill": ver("mill"), "@tjakoen/proof": ver("proof") };
                const f = `packages/${process.argv[1]}/package.json`;
                const j = JSON.parse(fs.readFileSync(f));
                for (const k of ["dependencies", "devDependencies"])
                  for (const d in (j[k] || {}))
                    if (String(j[k][d]).startsWith("workspace:") && map[d]) j[k][d] = map[d];
                fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              ' "$p"
              # npm tags a publish `latest` by DEFAULT, prerelease or not — so publishing
              # 0.1.5-rc.0 without --tag would hand it to everyone running a bare
              # `npm install @tjakoen/crumb`. Route any prerelease to a tag named after its
              # own identifier (0.1.5-rc.0 -> "rc") so `latest` only ever moves on a real release.
              tag=latest
              case "$v" in
                *-*) id=${v#*-}; id=${id%%.*}; tag=${id:-next} ;;
              esac
              echo "Publishing @tjakoen/$p@$v under dist-tag '$tag'"
              npm publish -w "@tjakoen/$p" "$reg" --access public --provenance --tag "$tag"
            fi
          done
