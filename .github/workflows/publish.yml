name: Publish packages

# Publishes @tjakoen/{grain,mill,proof,crumb} to the PUBLIC npm registry when their version
# changes. Bump a package's version in its package.json and push to main: this publishes the new
# version and skips any version already on the registry (so ordinary commits are a no-op).
#
# Needs an NPM_TOKEN repo secret: a granular npmjs token with read+write on @tjakoen/* and
# "Bypass 2FA" ticked (the account's 2FA is a passkey, so there is no OTP to supply).
#
# Every npm call passes --@tjakoen:registry explicitly. A scope mapping in an ambient .npmrc
# beats both publishConfig and --registry, so without it a stray mapping silently retargets
# this job at another registry (and `npm view` then reports that registry's versions).
#
# The loop order is the dependency order — grain, then mill, then proof and crumb.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: '@tjakoen'
      - name: Publish new package versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          reg=--@tjakoen:registry=https://registry.npmjs.org
          for p in grain mill proof crumb; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$reg" "@tjakoen/$p@$v" version >/dev/null 2>&1; then
              echo "@tjakoen/$p@$v already published — skipping"
            else
              # Substitute workspace:* deps -> the concrete sibling versions BEFORE publishing.
              # `npm publish -w` in this runner does not reliably rewrite the workspace: protocol
              # (crumb@0.1.0 shipped with literal "workspace:*" and was uninstallable), so do it
              # explicitly — the checkout is ephemeral, so mutating the manifest here is safe.
              node -e '
                const fs = require("fs");
                const ver = (n) => require(`./packages/${n}/package.json`).version;
                const map = { "@tjakoen/grain": ver("grain"), "@tjakoen/mill": ver("mill"), "@tjakoen/proof": ver("proof") };
                const f = `packages/${process.argv[1]}/package.json`;
                const j = JSON.parse(fs.readFileSync(f));
                for (const k of ["dependencies", "devDependencies"])
                  for (const d in (j[k] || {}))
                    if (String(j[k][d]).startsWith("workspace:") && map[d]) j[k][d] = map[d];
                fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              ' "$p"
              echo "Publishing @tjakoen/$p@$v"
              npm publish -w "@tjakoen/$p" "$reg" --access public
            fi
          done
